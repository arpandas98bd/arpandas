<style>

:root[data-theme="dark"]{--bg:#0e1511;--pn:#16211b;--ink:#e9f0ea;--mu:#9aada1;--ac:#7fdcae;--ac2:#f0c05a;--ln:#26362d;--rt:#7fdcae}
html{scroll-behavior:smooth;height:100%;scroll-padding-top:70px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 var(--bd)}

nav a.on{background:var(--pn);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ln)}
.ib{font:500 13px var(--bd);background:var(--pn);color:var(--ink);border:1px solid var(--ln);border-radius:99px;padding:5px 12px;cursor:pointer}
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--ln)}
#cv{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.hc{position:relative;max-width:1000px;margin:0 auto;padding:64px 20px 72px;display:grid;grid-template-columns:1fr 250px;gap:40px;align-items:center;pointer-events:none}
.hc a,.hc button,.hc .av{pointer-events:auto}
h1{font-size:clamp(44px,7vw,72px);letter-spacing:-.02em}
.role{font:500 20px var(--hd);color:var(--ac);margin:10px 0 14px}
.tag{max-width:540px;color:var(--mu);font-size:18px;margin:0 0 24px}
.btns{display:flex;gap:10px;flex-wrap:wrap}

.it .o{color:var(--ac);font-weight:500}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.sk{display:flex;flex-wrap:wrap;gap:8px}
.sc{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:6px 12px;font-weight:500;position:relative}
.sc small{color:var(--mu);font-weight:400;margin-left:6px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.gi{position:relative;aspect-ratio:4/3;border-radius:10px;overflow:hidden;border:1px solid var(--ln);cursor:zoom-in}
.gi img{width:100%;height:100%;object-fit:cover;transition:transform .3s}

.emp{color:var(--mu);font-style:italic}
.cl{display:flex;gap:10px;flex-wrap:wrap}
footer{text-align:center;color:var(--mu);padding:56px 20px 90px;font-size:14px}
.x,.add{display:none}
body.edit .x{display:grid;place-items:center;position:absolute;top:6px;right:0;width:24px;height:24px;border-radius:50%;border:0;background:#c0392b;color:#fff;cursor:pointer;line-height:1;font-size:15px;z-index:2}
body.edit .sc .x{top:-8px;right:-8px}
body.edit .add{display:inline-block;margin-top:12px}
body.edit [data-k]{outline:1px dashed color-mix(in srgb,var(--ac2) 70%,transparent);outline-offset:2px;cursor:text;min-width:2ch}
body.edit .av{cursor:pointer;outline:2px dashed var(--ac2)}
#bar{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:none;gap:8px;align-items:center;background:var(--ink);color:var(--bg);padding:8px 10px 8px 16px;border-radius:99px;z-index:9;font-size:13px;box-shadow:0 6px 24px #0004;max-width:96vw;flex-wrap:wrap;justify-content:center}
body.edit #bar{display:flex}
#bar button{border:0;border-radius:99px;padding:6px 12px;font:600 13px var(--bd);cursor:pointer;background:var(--bg);color:var(--ink)}
#ov{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:20;padding:16px}
#ov.on{display:grid}
#md{background:var(--pn);border-radius:14px;padding:22px;width:min(520px,100%);max-height:90vh;overflow:auto}
#md h3{font-size:22px;margin-bottom:12px}
#md label{display:block;font-size:13px;color:var(--mu);margin-top:10px}
#md input,#md textarea{width:100%;font:inherit;padding:9px 11px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--ink)}
#md .r{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#lb{position:fixed;inset:0;background:#000d;display:none;place-items:center;z-index:15;cursor:zoom-out}
#lb.on{display:grid}
#lb img{max-width:94vw;max-height:90vh;border-radius:8px}

@media(max-width:700px){.hc{grid-template-columns:1fr;padding-top:36px}.av{width:160px;height:190px;font-size:52px;order:-1}.it{grid-template-columns:1fr}}
</style>
