<script>
(function(){
 // 1) Browser tab title: always "Arpan Das | PhD Student, Texas A&M University"
 var TITLE = "Arpan Das | PhD Student, Texas A&M University";
 function setTitle(){ document.title = TITLE; }
 setTitle();
 window.addEventListener("load", setTitle);

 // 2) Portrait photo beside the intro (put your photo in the same folder as arpan.jpg)
 var tries = 0;
 function placePhoto(){
  var main = document.querySelector("main");
  if (!main || !main.firstElementChild) { if (tries++ < 40) setTimeout(placePhoto, 50); return; }
  if (document.querySelector(".home-hero")) return;
  var first = main.firstElementChild;
  var hero = document.createElement("div"); hero.className = "home-hero";
  var intro = document.createElement("div"); intro.className = "home-intro";
  var fig = document.createElement("figure"); fig.className = "home-photo";
  var img = new Image();
  img.src = window.PAGE.photo || "arpan.jpg";
  img.alt = "Portrait of Arpan Das";
  img.onerror = function(){ fig.style.display = "none"; };
  fig.appendChild(img);
  main.insertBefore(hero, first);
  intro.appendChild(first);
  hero.appendChild(intro);
  hero.appendChild(fig);
 }
 if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", placePhoto); else placePhoto();

 // 3) First landing: press the theme button once, automatically, so the visitor
 //    sees the same look they get after clicking it. Runs once per browser.
 var FLAG = "arpan_theme_auto_toggled";
 var seen = false;
 try { seen = localStorage.getItem(FLAG) === "1"; } catch(e){}
 if (!seen) {
  var t2 = 0;
  function findToggle(){
   var sel = ["#theme-toggle","#themeToggle","#theme","#toggle-theme",".theme-toggle",".theme-btn","[data-theme-toggle]","[data-toggle-theme]",
              "button[aria-label*='theme' i]","button[title*='theme' i]","[aria-label*='theme' i]","[title*='theme' i]"];
   for (var i=0;i<sel.length;i++){ var el = document.querySelector(sel[i]); if (el) return el; }
   var cands = document.querySelectorAll("nav button, header button, nav a, header a");
   for (var j=0;j<cands.length;j++){ if (/theme|dark|light|mode/i.test(cands[j].textContent || "")) return cands[j]; }
   return null;
  }
  function autoToggle(){
   var btn = findToggle();
   if (!btn) { if (t2++ < 40) setTimeout(autoToggle, 50); return; }
   btn.click();
   try { localStorage.setItem(FLAG, "1"); } catch(e){}
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", autoToggle); else autoToggle();
 }
})();
</script>
